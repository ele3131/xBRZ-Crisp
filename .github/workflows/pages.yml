name: Build & Deploy Comparison Page

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - "shaders/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless Mesa OpenGL ES, glslangValidator, Python imaging & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1-mesa-dri glslang-tools python3-pil python3-numpy \
            fonts-dejavu-core fonts-roboto-unhinted

      - name: Verify shaders & render all comparator, explain, and README visual assets
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NATIVE_VECTOR_WIDTH: "128"
        run: |
          python3 tools/verify.py --require-spirv
          python3 tools/render-docs.py --all --include-xbrz --force --workers 2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
