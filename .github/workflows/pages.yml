name: Build & Deploy Comparison Page

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - "shaders/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless Mesa OpenGL ES & Python imaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1-mesa-dri python3-pil python3-numpy

      - name: Verify shaders & render docs/img/*-crisp{10,20,30}.png
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python3 tools/verify.py
          python3 tools/render-docs.py --force

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
