name: Verify Shaders

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "**"]
    tags-ignore: ["*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless Mesa OpenGL ES, glslangValidator & Python imaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1-mesa-dri glslang-tools python3-pil python3-numpy

      - name: Verify single-source sync, lint, ES 1.00 / 3.00 / 3.10, SPIR-V & runtime smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NATIVE_VECTOR_WIDTH: "128"
        run: python3 tools/verify.py --smoke --require-spirv
